[package]
name = "forge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

[features]
default = []
consistency-v2 = []
# Post-v0.3 world pipeline. Release builds enable each milestone independently.
terrain-assets = []
building-assets = ["terrain-assets"]
map-compiler = ["building-assets"]
# Compatibility umbrella for development and the existing world contract tests.
world-assets = ["map-compiler"]
# Stage 2 game art manifest pipeline. Release builds enable each milestone independently.
game-art-manifest = []

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
forge_core = { package = "core", path = "../core" }
forge_pack = { package = "pack", path = "../pack" }
forge_providers = { package = "providers", path = "../providers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "7"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
