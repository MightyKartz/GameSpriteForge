[package]
name = "providers"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "forge_providers"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs-next = "2"
forge_core = { package = "core", path = "../core" }
gif = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { version = "0.12.22", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tempfile = "3"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
forge_pack = { package = "pack", path = "../pack" }
temp-env = "0.3"
