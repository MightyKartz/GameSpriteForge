name: Forge v0.3 Quality Matrix

on:
  pull_request:
    branches:
      - main
      - "codex/asset-library-*"
    paths:
      - ".agents/skills/forge-use/**"
      - ".github/workflows/v03-quality.yml"
      - ".github/workflows/release-cli.yml"
      - "benchmarks/**"
      - "examples/**"
      - "packages/cli/**"
      - "packages/core/**"
      - "packages/pack/**"
      - "packages/providers/**"
      - "profiles/**"
      - "schemas/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v03-quality:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install local asset test dependencies
        run: python3 -m pip install --requirement scripts/requirements-local-assets.txt

      - name: Test zero-generation reuse integrity
        run: python3 scripts/character/test_prepare_directional_reuse.py -v

      - name: Verify resource content identity and publication contracts
        run: |
          cargo test --locked -p core --test content_digest_tests --test asset_library_tests --test asset_library_review_tests
          cargo test --locked -p core --lib catalog::tests
          cargo test --locked -p core --lib library::metadata_write_tests

      - name: Install Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors \
            --retry-delay 5 --connect-timeout 30 --max-time 300 -fL \
            -o "${RUNNER_TEMP}/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_macos.universal.zip
          mkdir -p "${RUNNER_TEMP}/godot-bin"
          ditto -x -k "${RUNNER_TEMP}/godot.zip" "${RUNNER_TEMP}/godot-bin"
          godot_binary="$(find "${RUNNER_TEMP}/godot-bin" -type f -path '*/Contents/MacOS/Godot' -print -quit)"
          test -n "${godot_binary}"
          "${godot_binary}" --version | grep -E '^4\.6\.3'
          printf 'FORGE_GODOT_PATH=%s\n' "${godot_binary}" >> "${GITHUB_ENV}"
          ln -s "${godot_binary}" "${RUNNER_TEMP}/godot-bin/godot"
          printf '%s\n' "${RUNNER_TEMP}/godot-bin" >> "${GITHUB_PATH}"

      - name: Build pinned LGPL FFmpeg helpers
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors \
            --retry-delay 5 --connect-timeout 30 --max-time 300 -fL \
            -o "${RUNNER_TEMP}/ffmpeg-8.1.2.tar.xz" \
            https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz
          printf '%s  %s\n' \
            '464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c' \
            "${RUNNER_TEMP}/ffmpeg-8.1.2.tar.xz" | shasum -a 256 -c -
          tar -xf "${RUNNER_TEMP}/ffmpeg-8.1.2.tar.xz" -C "${RUNNER_TEMP}"
          cd "${RUNNER_TEMP}/ffmpeg-8.1.2"
          ./configure \
            --prefix="${RUNNER_TEMP}/ffmpeg" \
            --arch=arm64 \
            --target-os=darwin \
            --disable-gpl \
            --disable-nonfree \
            --disable-doc \
            --disable-debug \
            --disable-ffplay \
            --enable-static \
            --disable-shared
          make -j3 ffmpeg ffprobe
          mkdir -p "${RUNNER_TEMP}/ffmpeg/bin"
          cp ffmpeg ffprobe "${RUNNER_TEMP}/ffmpeg/bin/"
          "${RUNNER_TEMP}/ffmpeg/bin/ffmpeg" -version \
            > "${RUNNER_TEMP}/ffmpeg-version.txt"
          ! grep -E -- '--enable-(gpl|nonfree)' "${RUNNER_TEMP}/ffmpeg-version.txt"
          printf '%s\n' "${RUNNER_TEMP}/ffmpeg/bin" >> "${GITHUB_PATH}"

      - name: Run v0.3 release matrix
        shell: bash
        env:
          FORGE_V03_REPORT_DIR: ${{ runner.temp }}/forge-v03-quality
        run: bash scripts/test-v03-release-matrix.sh

      - name: Verify embedded guide and optional skill installation
        run: |
          cargo build --locked -p forge-cli --no-default-features
          python3 scripts/test-cli-skill.py --forge "${GITHUB_WORKSPACE}/target/debug/forge" --output "${RUNNER_TEMP}/forge-v03-quality/skill"
          python3 scripts/test-asset-library-cli.py --forge "${GITHUB_WORKSPACE}/target/debug/forge"
          python3 scripts/test-asset-library-review-cli.py --forge "${GITHUB_WORKSPACE}/target/debug/forge"

      - name: Verify consumer image contracts
        run: |
          cargo test --locked -p core --test image_contract_tests
          python3 scripts/test-image-contract-cli.py --forge "${GITHUB_WORKSPACE}/target/debug/forge"

      - name: Verify native static, layered and common playback contracts
        run: |
          cargo test --locked -p core --test prepare_static_tests --test source_matte_tests --test layered_pack_tests
          cargo test --locked -p pack
          python3 scripts/test-static-native-matte-cli.py --forge "${GITHUB_WORKSPACE}/target/debug/forge"
          python3 scripts/test-layered-cli.py --forge "${GITHUB_WORKSPACE}/target/debug/forge" --godot "$FORGE_GODOT_PATH" --output "${RUNNER_TEMP}/forge-v03-quality/layered"
          python3 scripts/test-godot-preview-ui.py --project "${RUNNER_TEMP}/forge-v03-quality/layered/preview/project" --godot "$FORGE_GODOT_PATH" --output "${RUNNER_TEMP}/forge-v03-quality/preview-ui"
          python3 scripts/test-godot-unified-player.py --godot "$FORGE_GODOT_PATH" --controller scripts/godot/runtime/layered-player-v1.gd

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forge-v03-quality-${{ github.run_id }}
          path: ${{ runner.temp }}/forge-v03-quality
          if-no-files-found: error
          retention-days: 14

  windows-cli:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install synthetic media test dependencies
        run: python -m pip install --requirement scripts/requirements-local-assets.txt
      - name: Build Windows source CLI and verify offline delivery contracts
        shell: pwsh
        run: |
          cargo build --locked -p forge-cli --no-default-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p core --lib video::ffmpeg::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p core --test content_digest_tests --test asset_library_tests --test asset_library_review_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p core --lib catalog::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p core --lib library::metadata_write_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p core --test image_contract_tests --test delivery_audit_tests --test static_delivery_tests --test prepare_static_tests --test source_matte_tests --test layered_pack_tests --test audio_plan_tests --test audio_processing_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p pack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-image-contract-cli.py --forge target/debug/forge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-asset-library-cli.py --forge target/debug/forge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-asset-library-review-cli.py --forge target/debug/forge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-cli-skill.py --forge "$env:GITHUB_WORKSPACE/target/debug/forge.exe" --guide-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
