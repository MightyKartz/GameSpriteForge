name: Release Forge CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to preflight (no GitHub Release is created)"
        required: true
        default: "v0.3.0"
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      FORGE_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install local asset test dependencies
        run: python3 -m pip install --requirement scripts/requirements-local-assets.txt

      - name: Install release Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Select release Rust toolchain
        run: rustup override set 1.98.0

      - name: Verify tag and source
        shell: bash
        run: |
          set -euo pipefail
          [[ "${FORGE_RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]
          test -s "docs/releases/${FORGE_RELEASE_TAG%%-*}.md"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(package["version"] for package in data["packages"] if package["name"] == "forge-cli"))')"
          test "${FORGE_RELEASE_TAG}" = "v${cargo_version}"
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --no-fail-fast

      - name: Build Forge
        run: cargo build --locked -p forge-cli --release --target aarch64-apple-darwin

      - name: Verify compiled release identity
        run: |
          python3 scripts/verify-cli-build.py \
            --forge target/aarch64-apple-darwin/release/forge \
            --version "${FORGE_RELEASE_TAG#v}" --commit "${GITHUB_SHA}" --release

      - name: Build pinned LGPL FFmpeg helpers
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors \
            --retry-delay 5 --connect-timeout 30 --max-time 300 -fLO \
            https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz
          printf '%s  %s\n' \
            '464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c' \
            'ffmpeg-8.1.2.tar.xz' | shasum -a 256 -c -
          tar -xf ffmpeg-8.1.2.tar.xz
          cd ffmpeg-8.1.2
          ./configure \
            --prefix="${RUNNER_TEMP}/ffmpeg" \
            --arch=arm64 \
            --target-os=darwin \
            --disable-gpl \
            --disable-nonfree \
            --disable-doc \
            --disable-debug \
            --disable-ffplay \
            --enable-static \
            --disable-shared
          make -j3 ffmpeg ffprobe
          ./ffmpeg -version | tee "${RUNNER_TEMP}/ffmpeg-version.txt"
          ! grep -E -- '--enable-(gpl|nonfree)' "${RUNNER_TEMP}/ffmpeg-version.txt"
          mkdir -p "${RUNNER_TEMP}/ffmpeg/bin"
          cp ffmpeg ffprobe "${RUNNER_TEMP}/ffmpeg/bin/"

      - name: Run CLI product, installer, and release contracts
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors \
            --retry-delay 5 --connect-timeout 30 --max-time 300 -fL \
            -o "${RUNNER_TEMP}/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_macos.universal.zip
          mkdir -p "${RUNNER_TEMP}/godot-bin"
          ditto -x -k "${RUNNER_TEMP}/godot.zip" "${RUNNER_TEMP}/godot-bin"
          godot_binary="$(find "${RUNNER_TEMP}/godot-bin" -type f -path '*/Contents/MacOS/Godot' -print -quit)"
          test -n "${godot_binary}"
          ln -s "${godot_binary}" "${RUNNER_TEMP}/godot-bin/godot"
          export PATH="${RUNNER_TEMP}/ffmpeg/bin:${RUNNER_TEMP}/godot-bin:${PATH}"
          godot --version | grep -E '^4\.6\.'
          export FORGE_GODOT_PATH="${godot_binary}"
          export GODOT_BIN="${godot_binary}"
          FORGE_BINARY="${GITHUB_WORKSPACE}/target/aarch64-apple-darwin/release/forge" bash scripts/test-cli-product.sh
          cargo test -p core --test static_delivery_tests -- --ignored --nocapture
          python3 scripts/test-local-static-cli.py \
            --forge "${GITHUB_WORKSPACE}/target/aarch64-apple-darwin/release/forge" \
            --godot "${godot_binary}" --output "${RUNNER_TEMP}/local-static-delivery"
          python3 scripts/test-local-animation-delivery.py \
            --forge "${GITHUB_WORKSPACE}/target/aarch64-apple-darwin/release/forge" \
            --godot "${godot_binary}" --output "${RUNNER_TEMP}/local-animation-delivery"
          python3 scripts/character/test_prepare_directional_reuse.py -v
          bash scripts/test-cli-installer.sh
          bash scripts/test-cli-signing-contract.sh

      - name: Package unsigned CLI release
        shell: bash
        run: |
          set -euo pipefail
          DIST="${RUNNER_TEMP}/forge-dist"
          mkdir -p "${DIST}/bin" "${DIST}/licenses"
          cp target/aarch64-apple-darwin/release/forge "${DIST}/bin/forge"
          cp "${RUNNER_TEMP}/ffmpeg/bin/ffmpeg" "${RUNNER_TEMP}/ffmpeg/bin/ffprobe" "${DIST}/bin/"
          cp LICENSE THIRD_PARTY_NOTICES.md third_party/ffmpeg/BUILD.md third_party/ffmpeg/PATCHES.md "${DIST}/licenses/"
          cp ffmpeg-8.1.2/COPYING.LGPLv2.1 "${DIST}/licenses/FFMPEG-LGPL-2.1.txt"
          cp "${RUNNER_TEMP}/ffmpeg-version.txt" "${DIST}/licenses/"
          printf '{"version":"%s","commit":"%s","target":"aarch64-apple-darwin","rustc":"%s","appleSigned":false,"notarized":false}\n' \
            "${FORGE_RELEASE_TAG#v}" "${GITHUB_SHA}" "$(rustc --version)" \
            > "${DIST}/BUILD_INFO.json"
          (
            cd "${DIST}"
            shasum -a 256 bin/forge bin/ffmpeg bin/ffprobe licenses/* BUILD_INFO.json \
              > MANIFEST.sha256
            shasum -a 256 -c MANIFEST.sha256
          )
          ditto -c -k --keepParent "${DIST}" forge-aarch64-apple-darwin.zip
          shasum -a 256 forge-aarch64-apple-darwin.zip > forge-aarch64-apple-darwin.zip.sha256
          cp ffmpeg-8.1.2.tar.xz ffmpeg-8.1.2-source.tar.xz
          cp install.sh forge-installer.sh

      - name: Verify packaged fresh install and upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/previous-release"
          gh release download v0.2.1 --dir "${RUNNER_TEMP}/previous-release" \
            --pattern 'forge-aarch64-apple-darwin.zip*'
          export PATH="${RUNNER_TEMP}/godot-bin:${PATH}"
          bash scripts/test-cli-release-artifact.sh \
            "${GITHUB_WORKSPACE}" "${FORGE_RELEASE_TAG}" \
            "${RUNNER_TEMP}/previous-release" v0.2.1

      - name: Generate SBOM
        env:
          CARGO_NET_RETRY: "5"
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --locked \
            --git https://github.com/CycloneDX/cyclonedx-rust-cargo.git \
            --rev d5c35fdf2150c73e2e3570c59fb40daa1f0a96c3
          cargo cyclonedx \
            --manifest-path packages/cli/Cargo.toml \
            --format json \
            --target aarch64-apple-darwin \
            --override-filename forge-sbom.cdx
          test -s packages/cli/forge-sbom.cdx.json
          cp packages/cli/forge-sbom.cdx.json forge-sbom.cdx.json

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forge-cli-${{ env.FORGE_RELEASE_TAG }}-${{ github.run_id }}
          path: |
            forge-aarch64-apple-darwin.zip
            forge-aarch64-apple-darwin.zip.sha256
            forge-installer.sh
            forge-sbom.cdx.json
            ffmpeg-8.1.2-source.tar.xz
          if-no-files-found: error
          retention-days: 14

      - name: Attest release binary
        if: github.event_name == 'push'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: forge-aarch64-apple-darwin.zip
          sbom-path: forge-sbom.cdx.json

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=(--latest)
          if [[ "${FORGE_RELEASE_TAG}" == *-rc.* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          gh release create "${FORGE_RELEASE_TAG}" --verify-tag "${release_flags[@]}" \
            --title "Forge CLI ${FORGE_RELEASE_TAG}" \
            --notes-file "docs/releases/${FORGE_RELEASE_TAG%%-*}.md" \
            forge-aarch64-apple-darwin.zip \
            forge-aarch64-apple-darwin.zip.sha256 \
            forge-installer.sh \
            forge-sbom.cdx.json \
            ffmpeg-8.1.2-source.tar.xz \
            third_party/ffmpeg/BUILD.md \
            third_party/ffmpeg/PATCHES.md \
            THIRD_PARTY_NOTICES.md \
            LICENSE
